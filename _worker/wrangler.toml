name = "neeshad-analytics"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Created by: wrangler d1 create neeshad_analytics
# Paste the database_id it prints into the line below.
[[d1_databases]]
binding = "DB"
database_name = "neeshad_analytics"
database_id = "b3d7e80e-6532-451c-a5b3-740e14046f6c"

[vars]
# Only these origins may post hits. Anything else is rejected.
ALLOWED_ORIGINS = "https://www.neeshad.space,https://neeshad.space"

# Secrets are NOT stored here. Set them once with:
#   wrangler secret put DASH_PASSWORD   -> password for the dashboard
#   wrangler secret put HASH_SALT       -> any long random string
